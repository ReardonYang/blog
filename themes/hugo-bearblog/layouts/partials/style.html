<style>
  body {
    font-family: Verdana, sans-serif;
    margin: auto;
    padding: 20px;
    max-width: 720px;
    text-align: left;
    background-color: #fff;
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.5;
    color: #444;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6,
  strong,
  b {
    color: #222;
  }

  a {
    color: #3273dc;
    /*color: #ff5e6c;*/
  }

  .title {
    text-decoration: none;
    border: 0;
  }

  .title span {
    font-weight: 400;
  }

  nav a {
    margin-right: 10px;
    text-decoration: none;
  }

  nav a:hover {
    text-decoration: none;
  }

  textarea {
    width: 100%;
    font-size: 16px;
  }

  input {
    font-size: 16px;
  }

  content {
    line-height: 1.6;
  }

  table {
    width: 100%;
  }

  img {
    max-width: 100%;
  }

  code {
    padding: 2px 5px;
    background-color: #f2f2f2;
  }

  pre code {
    color: #222;
    display: block;
    padding: 20px;
    white-space: pre-wrap;
    font-size: 14px;
  }

  div.highlight pre {
    background-color: initial;
    color: initial;
  }

  div.highlight code {
    background-color: unset;
    color: unset;
  }

  blockquote {
    border-left: 1px solid #999;
    color: #222;
    padding-left: 20px;
    font-style: italic;
  }

  footer {
    padding: 25px;
    text-align: center;
  }

  .helptext {
    color: #777;
    font-size: small;
  }

  .errorlist {
    color: #eba613;
    font-size: small;
  }

  /* blog posts */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
    color: #8b6fcb;
  }

  /* header row with theme toggle */
  .site-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .theme-toggle {
    background: none;
    border: 0;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    padding: 6px 2px;
    color: #999;
  }

  .theme-toggle:hover {
    color: #3273dc;
  }

  /* year separator in the post list */
  ul.blog-posts li.year-sep {
    display: block;
    text-align: center;
    color: #aaa;
    font-size: 13px;
    letter-spacing: 4px;
    padding: 14px 0 4px;
  }

  /* post search */
  .post-search {
    margin: 6px 0 14px;
  }

  .post-search input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 0;
    background: transparent;
    color: inherit;
  }

  .post-search input:focus {
    outline: 1px solid #3273dc;
    border-color: #3273dc;
  }

  ul.blog-posts li.no-result {
    display: none;
    color: #999;
  }

  /* prev / next navigation on post pages */
  .post-nav {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    border-top: 1px dashed #999;
    margin-top: 34px;
    padding-top: 16px;
  }

  .post-nav a {
    text-decoration: none;
  }

  .post-nav .nav-next {
    text-align: right;
    margin-left: auto;
  }

  /* halving page */
  .halving-table {
    border-collapse: collapse;
    font-size: 14px;
  }

  .halving-table th,
  .halving-table td {
    padding: 6px 8px;
    border-bottom: 1px solid #e5e5e5;
    text-align: left;
  }

  .halving-table td.num,
  .halving-table th.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .halving-table tr.done td {
    color: #222;
  }

  .halving-table tr.future td {
    color: #888;
  }

  .chart-wrap {
    overflow-x: auto;
    margin: 18px 0 6px;
  }

  /* whitepaper pages */
  .paper-page {
    margin: 22px 0;
    text-align: center;
  }

  .paper-page img {
    border: 1px solid #ddd;
  }

  .paper-page figcaption {
    color: #999;
    font-size: 13px;
    margin-top: 6px;
    letter-spacing: 2px;
  }

  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) body {
      background-color: #0e2d3b;
      color: #d5e2e7;
    }

    html:not([data-theme="light"]) h1,
    html:not([data-theme="light"]) h2,
    html:not([data-theme="light"]) h3,
    html:not([data-theme="light"]) h4,
    html:not([data-theme="light"]) h5,
    html:not([data-theme="light"]) h6,
    html:not([data-theme="light"]) strong,
    html:not([data-theme="light"]) b {
      color: #eef6f8;
    }

    html:not([data-theme="light"]) a {
      color: #8cc2dd;
    }

    html:not([data-theme="light"]) ul.blog-posts li a:visited {
      color: #a58fd6;
    }

    html:not([data-theme="light"]) code {
      background-color: #1c4252;
    }

    html:not([data-theme="light"]) pre code {
      color: #ddd;
    }

    html:not([data-theme="light"]) blockquote {
      color: #cfe0e6;
    }

    html:not([data-theme="light"]) textarea,
    html:not([data-theme="light"]) input {
      background-color: #123745;
      color: #e6f0f3;
    }

    html:not([data-theme="light"]) .helptext {
      color: #9db6bf;
    }

    html:not([data-theme="light"]) .halving-table th,
    html:not([data-theme="light"]) .halving-table td {
      border-bottom-color: #2c5265;
    }

    html:not([data-theme="light"]) .halving-table tr.done td {
      color: #eef6f8;
    }

    html:not([data-theme="light"]) .halving-table tr.future td {
      color: #8fa8b1;
    }

    html:not([data-theme="light"]) .paper-page img {
      border-color: #2c5265;
    }

    html:not([data-theme="light"]) .post-search input {
      border-color: #2c5265;
    }
  }

  html[data-theme="dark"] body {
    background-color: #0e2d3b;
    color: #d5e2e7;
  }

  html[data-theme="dark"] h1,
  html[data-theme="dark"] h2,
  html[data-theme="dark"] h3,
  html[data-theme="dark"] h4,
  html[data-theme="dark"] h5,
  html[data-theme="dark"] h6,
  html[data-theme="dark"] strong,
  html[data-theme="dark"] b {
    color: #eef6f8;
  }

  html[data-theme="dark"] a {
    color: #8cc2dd;
  }

  html[data-theme="dark"] ul.blog-posts li a:visited {
    color: #a58fd6;
  }

  html[data-theme="dark"] code {
    background-color: #1c4252;
  }

  html[data-theme="dark"] pre code {
    color: #ddd;
  }

  html[data-theme="dark"] blockquote {
    color: #cfe0e6;
  }

  html[data-theme="dark"] textarea,
  html[data-theme="dark"] input {
    background-color: #123745;
    color: #e6f0f3;
  }

  html[data-theme="dark"] .helptext {
    color: #9db6bf;
  }

  html[data-theme="dark"] .halving-table th,
  html[data-theme="dark"] .halving-table td {
    border-bottom-color: #2c5265;
  }

  html[data-theme="dark"] .halving-table tr.done td {
    color: #eef6f8;
  }

  html[data-theme="dark"] .halving-table tr.future td {
    color: #8fa8b1;
  }

  html[data-theme="dark"] .paper-page img {
    border-color: #2c5265;
  }

  html[data-theme="dark"] .post-search input {
    border-color: #2c5265;
  }

</style>
