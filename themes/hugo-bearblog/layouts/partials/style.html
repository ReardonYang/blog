<style>
  body {
    font-family: Verdana, sans-serif;
    margin: auto;
    padding: 20px;
    max-width: 720px;
    text-align: left;
    background-color: #fff;
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.5;
    color: #444;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6,
  strong,
  b {
    color: #222;
  }

  a {
    color: #1e4d3a;
    text-decoration: none;
  }

  .title {
    text-decoration: none;
    border: 0;
  }

  .title span {
    font-weight: 400;
  }

  nav a {
    margin-right: 10px;
    text-decoration: none;
  }

  nav a:hover {
    text-decoration: none;
  }

  textarea {
    width: 100%;
    font-size: 16px;
  }

  input {
    font-size: 16px;
  }

  content {
    line-height: 1.6;
  }

  table {
    width: 100%;
  }

  img {
    max-width: 100%;
  }

  code {
    padding: 2px 5px;
    background-color: #f2f2f2;
  }

  pre code {
    color: #222;
    display: block;
    padding: 20px;
    white-space: pre-wrap;
    font-size: 14px;
  }

  div.highlight pre {
    background-color: initial;
    color: initial;
  }

  div.highlight code {
    background-color: unset;
    color: unset;
  }

  blockquote {
    border-left: 1px solid #999;
    color: #222;
    padding-left: 20px;
    font-style: italic;
  }

  footer {
    padding: 25px;
    text-align: center;
  }

  .helptext {
    color: #777;
    font-size: small;
  }

  .errorlist {
    color: #eba613;
    font-size: small;
  }

  /* blog posts */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
    color: #7d8c74;
  }

  /* header row with theme toggle */
  .site-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .theme-toggle {
    background: none;
    border: 0;
    cursor: pointer;
    line-height: 0;
    padding: 6px 2px;
    color: #8a8a8a;
  }

  .theme-toggle svg {
    display: none;
  }

  .theme-toggle[data-mode="light"] .icon-sun {
    display: block;
  }

  .theme-toggle[data-mode="dark"] .icon-moon {
    display: block;
    color: #9db6bf;
  }

  hr {
    border: 0;
    border-top: 1px dashed #bbb;
  }

  /* year separator in the post list */
  ul.blog-posts li.year-sep {
    display: block;
    text-align: center;
    color: #aaa;
    font-size: 13px;
    letter-spacing: 4px;
    padding: 14px 0 4px;
  }

  /* header action icons (search + theme) */
  .head-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .icon-btn {
    background: none;
    border: 0;
    cursor: pointer;
    width: 32px;
    height: 32px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 0;
    color: #8a8a8a;
  }

  /* floating header search */
  header {
    position: relative;
  }

  .search-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(13, 24, 22, .40);
    z-index: 59;
  }

  .search-backdrop.open {
    display: block;
    animation: search-fade .15s ease;
  }

  @keyframes search-fade {
    from {
      opacity: 0;
    }

    to {
      opacity: 1;
    }
  }

  .search-panel {
    display: none;
    position: fixed;
    top: 38vh;
    left: 50%;
    transform: translateX(-50%);
    width: min(560px, calc(100vw - 40px));
    box-sizing: border-box;
    padding: 9px 14px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 0;
    box-shadow: 0 16px 44px rgba(0, 0, 0, .18);
    z-index: 60;
  }

  .search-panel.open {
    display: flex;
    align-items: center;
    gap: 9px;
    animation: search-in .18s ease;
  }

  .search-panel:focus-within {
    border-color: #1e4d3a;
  }

  @keyframes search-in {
    from {
      opacity: 0;
      transform: translate(-50%, -6px);
    }

    to {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  }

  .search-panel svg {
    flex: none;
    color: #aaa;
    pointer-events: none;
  }

  .search-panel input {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 0;
    border: 0;
    background: transparent;
    color: inherit;
    font-size: 16px;
    outline: none;
  }

  .search-panel input::placeholder {
    color: #aaa;
  }



  ul.blog-posts li.no-result {
    display: none;
    color: #999;
  }

  /* prev / next navigation on post pages */
  .post-nav {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    border-top: 1px dashed #999;
    margin-top: 34px;
    padding-top: 16px;
  }

  .post-nav a {
    text-decoration: none;
  }

  .post-nav .nav-next {
    text-align: right;
    margin-left: auto;
  }

  /* content tables (e.g. halving schedule) */
  content table {
    border-collapse: collapse;
    font-size: 14px;
  }

  content table th,
  content table td {
    padding: 6px 8px;
    border-bottom: 1px solid #e5e5e5;
    text-align: left;
  }

  /* whitepaper pages */
  .paper-page {
    margin: 22px 0;
    text-align: center;
  }

  .paper-page img {
    border: 1px solid #ddd;
  }

  .paper-page figcaption {
    color: #999;
    font-size: 13px;
    margin-top: 6px;
    letter-spacing: 2px;
  }

  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) body {
      background-color: #0a2a38;
      color: #d5e2e7;
    }

    html:not([data-theme="light"]) h1,
    html:not([data-theme="light"]) h2,
    html:not([data-theme="light"]) h3,
    html:not([data-theme="light"]) h4,
    html:not([data-theme="light"]) h5,
    html:not([data-theme="light"]) h6,
    html:not([data-theme="light"]) strong,
    html:not([data-theme="light"]) b {
      color: #eef6f8;
    }

    html:not([data-theme="light"]) a {
      color: #8cc2dd;
    }

    html:not([data-theme="light"]) ul.blog-posts li a:visited {
      color: #a58fd6;
    }

    html:not([data-theme="light"]) code {
      background-color: #1c4252;
    }

    html:not([data-theme="light"]) pre code {
      color: #ddd;
    }

    html:not([data-theme="light"]) blockquote {
      color: #cfe0e6;
    }

    html:not([data-theme="light"]) textarea,
    html:not([data-theme="light"]) input {
      background-color: #123745;
      color: #e6f0f3;
    }

    html:not([data-theme="light"]) .helptext {
      color: #9db6bf;
    }

    html:not([data-theme="light"]) content table th,
    html:not([data-theme="light"]) content table td {
      border-bottom-color: #2c5265;
    }



    html:not([data-theme="light"]) .paper-page img {
      border-color: #2c5265;
    }

    html:not([data-theme="light"]) .search-panel input {
      border-color: #2c5265;
    }
  }

  html[data-theme="dark"] body {
    background-color: #0a2a38;
    color: #d5e2e7;
  }

  html[data-theme="dark"] h1,
  html[data-theme="dark"] h2,
  html[data-theme="dark"] h3,
  html[data-theme="dark"] h4,
  html[data-theme="dark"] h5,
  html[data-theme="dark"] h6,
  html[data-theme="dark"] strong,
  html[data-theme="dark"] b {
    color: #eef6f8;
  }

  html[data-theme="dark"] a {
    color: #8cc2dd;
  }

  html[data-theme="dark"] ul.blog-posts li a:visited {
    color: #a58fd6;
  }

  html[data-theme="dark"] code {
    background-color: #1c4252;
  }

  html[data-theme="dark"] pre code {
    color: #ddd;
  }

  html[data-theme="dark"] blockquote {
    color: #cfe0e6;
  }

  html[data-theme="dark"] textarea,
  html[data-theme="dark"] input {
    background-color: #123745;
    color: #e6f0f3;
  }

  html[data-theme="dark"] .helptext {
    color: #9db6bf;
  }

  html[data-theme="dark"] content table th,
  html[data-theme="dark"] content table td {
    border-bottom-color: #2c5265;
  }



  html[data-theme="dark"] .paper-page img {
    border-color: #2c5265;
  }

  html[data-theme="dark"] .search-panel input {
    border-color: #2c5265;
  }

  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) hr {
      border-top-color: rgba(213, 226, 231, .35);
    }

    html:not([data-theme="light"]) blockquote {
      border-left-color: rgba(213, 226, 231, .4);
    }

    html:not([data-theme="light"]) .post-nav {
      border-top-color: rgba(213, 226, 231, .35);
    }

    html:not([data-theme="light"]) .search-panel {
      background: #0f3242;
      border-color: #2c5265;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
    }

    html:not([data-theme="light"]) .search-backdrop {
      background: rgba(0, 0, 0, .55);
    }

    html:not([data-theme="light"]) .search-panel input {
      background: transparent;
      border-color: #2c5265;
    }

    html:not([data-theme="light"]) .search-panel:focus-within {
      border-color: #8cc2dd;
      background: rgba(255, 255, 255, .05);
    }
  }

  html[data-theme="dark"] hr {
    border-top-color: rgba(213, 226, 231, .35);
  }

  html[data-theme="dark"] blockquote {
    border-left-color: rgba(213, 226, 231, .4);
  }

  html[data-theme="dark"] .post-nav {
    border-top-color: rgba(213, 226, 231, .35);
  }

  html[data-theme="dark"] .search-panel {
    background: #0f3242;
    border-color: #2c5265;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
  }

  html[data-theme="dark"] .search-backdrop {
    background: rgba(0, 0, 0, .55);
  }

  html[data-theme="dark"] .search-panel input {
    background: transparent;
  }

  html[data-theme="dark"] .search-panel:focus-within {
    border-color: #8cc2dd;
    background: rgba(255, 255, 255, .05);
  }

</style>
